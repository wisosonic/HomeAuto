[project]
name = "homeauto"
version = "0.1.0"
description = "Raspberry Pi 5 home automation backend: sensor drivers"
requires-python = ">=3.11"
dependencies = [
    "gpiozero>=2.0.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Pi 5 GPIO backend (RPi.GPIO does not work on the Pi 5). Linux only.
    "lgpio>=0.2.2; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["homeauto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
